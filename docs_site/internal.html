<div class="tl-strip" role="region" aria-label="Access notice">Internal &ndash; authorised staff only</div>

      <p id="message" class="tl-message" role="alert"></p>
      <p class="tl-note">Your session lives in this tab only. Closing or reloading the page signs you out.</p>
